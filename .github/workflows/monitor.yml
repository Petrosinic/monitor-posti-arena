name: Monitor posti Lago dei Cigni

on:
  schedule:
    # SOLO DI NOTTE, dalle 23 alle 9 italiane (le ore del cron sono UTC).
    #
    # Di giorno controlla l'attivita' pianificata sul PC, ogni 10 minuti e in
    # modo affidabile. Far girare anche questo significherebbe solo ricevere
    # ogni avviso due volte, perche' i due hanno memorie separate.
    # Di notte il PC e' spento e questo e' l'unico controllo possibile.
    #
    # Restringere la fascia non toglie nemmeno uno slot notturno: "*/15 22-23,0-7"
    # ha, fra le 22 e le 7 UTC, esattamente gli stessi istanti di "*/15 * * * *".
    # Si perdono solo gli slot diurni, che erano ridondanti.
    #
    # Nota sull'affidabilita': lo scheduler di GitHub e' molto discontinuo. Il
    # primo run programmato e' arrivato sette ore dopo la pubblicazione, e poi
    # tre ore di silenzio. Qui e' una rete di sicurezza, non una garanzia.
    - cron: "*/15 22-23,0-7 * * *"
  # Permette di lanciarlo a mano dalla scheda Actions
  workflow_dispatch:

# Serve per ricommittare lo stato (altrimenti ogni run ripartirebbe da zero
# e riavviserebbe sempre le stesse cose)
permissions:
  contents: write

# Mai due controlli insieme: si pesterebbero i piedi sul push dello stato
concurrency:
  group: monitor-posti
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Riusa il browser scaricato la volta prima
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Controlla la disponibilita'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MONITOR_CONFIG: config.ci.json
          MONITOR_STATE: ci-state.json
          MONITOR_LOG: ci-monitor.log
          TZ: Europe/Rome
        run: python monitor_arena.py once

      # Lo stato appena calcolato viene riportato sempre sull'ULTIMA versione del
      # branch, non rebasato sopra. Il rebase falliva quando il commit da
      # riportare aggiungeva ci-state.json e il branch ce l'aveva gia': git lo
      # vede come "both added" e si ferma in conflitto. Succede a ogni "Re-run"
      # di un run vecchio, perche' rimette in gioco un commit precedente alla
      # nascita del file. Qui invece si riparte dal remoto e vince il file nuovo,
      # che e' quello appena letto dal sito: conflitti impossibili.
      - name: Salva lo stato nel repository
        if: always()
        run: |
          set -e
          if [ ! -f ci-state.json ]; then
            echo "Nessuno stato da salvare (il controllo non e' arrivato a scriverlo)."
            exit 0
          fi
          cp ci-state.json "${RUNNER_TEMP}/ci-state.nuovo.json"
          git config user.name "monitor-posti"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for tentativo in 1 2 3; do
            git fetch -q origin "${GITHUB_REF_NAME}"
            rm -f ci-state.json
            git checkout -q -B salvataggio "origin/${GITHUB_REF_NAME}"
            cp "${RUNNER_TEMP}/ci-state.nuovo.json" ci-state.json

            if [ -z "$(git status --porcelain ci-state.json)" ]; then
              echo "Stato invariato rispetto al repository, niente da committare."
              exit 0
            fi

            git add ci-state.json
            git commit -q -m "stato posti $(date -u '+%Y-%m-%d %H:%M UTC')"
            if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Stato salvato al tentativo ${tentativo}."
              exit 0
            fi
            echo "Push rifiutato: qualcuno ha scritto nel frattempo. Riprovo."
            sleep 3
          done

          echo "Non sono riuscito a salvare lo stato dopo 3 tentativi."
          exit 1

      - name: Allega il log del controllo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.run_number }}
          path: ci-monitor.log
          if-no-files-found: ignore
          retention-days: 7
